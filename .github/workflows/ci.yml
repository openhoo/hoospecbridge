name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm pack --ignore-scripts
      - name: Verify packaged CLI and library
        run: |
          mkdir /tmp/hoospecbridge-package
          cd /tmp/hoospecbridge-package
          npm init -y
          npm install "$GITHUB_WORKSPACE/hoospecbridge-0.1.0.tgz"
          npx --no-install hoospecbridge --help
          node --input-type=module -e "import {parseTasks} from 'hoospecbridge'; if(parseTasks('- [ ] T001 Verify package', 'specs/test/tasks.md').length !== 1) process.exit(1)"
